<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">CacheWitness — the request before yours matters.</title>
  <desc id="desc">A dark teal banner with a request sequence: Alice primes a shared cache, then Bob's response is checked against his cold baseline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b35"/><stop offset="1" stop-color="#08171f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6ea8ae" stroke-opacity=".07"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#7fc2bf" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect x="48" y="48" width="5" height="24" rx="2.5" fill="#66e2c1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="68" y="65" fill="#9bb8bf" font-size="14" letter-spacing="3">HTTP RESPONSE ISOLATION</text>
    <text x="48" y="145" fill="#f2f7f8" font-size="66" font-weight="700" letter-spacing="-2">CacheWitness</text>
    <text x="51" y="193" fill="#c0d1d7" font-size="25">The request before yours matters.</text>
    <text x="51" y="280" fill="#7fa0aa" font-size="15">LOCAL CLI</text><circle cx="150" cy="275" r="2" fill="#44727e"/>
    <text x="169" y="280" fill="#7fa0aa" font-size="15">OFFLINE REPORTS</text><circle cx="331" cy="275" r="2" fill="#44727e"/>
    <text x="350" y="280" fill="#7fa0aa" font-size="15">ZERO DEPENDENCIES</text>
    <g transform="translate(728 58)">
      <rect width="502" height="244" rx="12" fill="#0b2029" stroke="#29434d"/>
      <text x="25" y="37" fill="#809da6" font-size="12" letter-spacing="2">THE EXPERIMENT</text>
      <rect x="25" y="65" width="120" height="44" rx="7" fill="#163832" stroke="#2f6a5d"/>
      <text x="85" y="93" fill="#90e7cf" font-size="16" text-anchor="middle">Alice primes</text>
      <path d="M156 87h44" stroke="#7fc2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="213" y="65" width="264" height="44" rx="7" fill="#122b36" stroke="#304d58"/>
      <text x="345" y="93" fill="#c4d8df" font-size="16" text-anchor="middle">Bob requests the same endpoint</text>
      <path d="M345 119v25" stroke="#7fc2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="25" y="157" width="452" height="60" rx="7" fill="#102f30" stroke="#2c6962"/>
      <circle cx="49" cy="187" r="5" fill="#66e2c1"/>
      <text x="66" y="183" fill="#d5ebe8" font-size="16" font-weight="600">Compare with Bob's cold response</text>
      <text x="66" y="202" fill="#8fb6b4" font-size="12">Both orders. Stable baselines. Reviewable evidence.</text>
    </g>
  </g>
</svg>
