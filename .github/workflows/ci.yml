name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify:package

  action:
    name: GitHub Action / ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        fixture: [broken, fixed]
    env:
      CACHEWITNESS_BASE_URL: http://127.0.0.1:4318
      CACHEWITNESS_ALICE_TOKEN: demo-alice
      CACHEWITNESS_BOB_TOKEN: demo-bob
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Start the isolated fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          if [ "$FIXTURE" = fixed ]; then
            node examples/server.js --fixed > "$RUNNER_TEMP/fixture.log" 2>&1 &
          else
            node examples/server.js > "$RUNNER_TEMP/fixture.log" 2>&1 &
          fi
          node --input-type=module <<'NODE'
          for (let attempt = 0; attempt < 50; attempt++) {
            try { await fetch(process.env.CACHEWITNESS_BASE_URL); process.exit(0); }
            catch { await new Promise(resolve => setTimeout(resolve, 100)); }
          }
          process.exit(1);
          NODE
      - name: Run the public action against the fixture
        id: witness
        continue-on-error: true
        uses: ./
        with:
          config: examples/cachewitness.json
      - name: Verify action verdict and report artifacts
        env:
          FIXTURE: ${{ matrix.fixture }}
          AUDIT_OUTCOME: ${{ steps.witness.outcome }}
          AUDIT_STATUS: ${{ steps.witness.outputs.status }}
          REPORT_JSON: ${{ steps.witness.outputs.report-json }}
          REPORT_HTML: ${{ steps.witness.outputs.report-html }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const fixed = process.env.FIXTURE === 'fixed';
          assert.equal(process.env.AUDIT_OUTCOME, fixed ? 'success' : 'failure');
          assert.equal(process.env.AUDIT_STATUS, fixed ? 'pass' : 'fail');
          const report = JSON.parse(await readFile(process.env.REPORT_JSON, 'utf8'));
          assert.equal(report.status, fixed ? 'pass' : 'fail');
          assert.equal(fixed ? report.summary.passed : report.summary.contamination, 2);
          assert.match(await readFile(process.env.REPORT_HTML, 'utf8'), /<!doctype html>/i);
          NODE
      - name: Save synthetic example reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cachewitness-${{ matrix.fixture }}
          path: cachewitness-reports/
          if-no-files-found: error
          retention-days: 7
